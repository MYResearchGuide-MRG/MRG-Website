<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mrg-logo-inverted.png" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="The Malaysia Science Scholar's Programme (MYSSP) is MYResearchGuide's flagship 8-week research mentorship programme for Malaysian pre-university students: project directory, researcher panel, timeline and how to apply."
    />
    <meta property="og:title" content="Malaysia Science Scholar's Programme" />
    <meta
      property="og:description"
      content="Malaysia's first science research programme for pre-university students, by MYResearchGuide."
    />
    <meta property="og:type" content="website" />
    <title>Malaysia Science Scholar's Programme — MYSSP 2026</title>
    <!-- Stamp the theme class before first paint. The provider reads
         localStorage during render, but without this the page paints once in
         the wrong theme first — very visible now that the default is dark. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : stored === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : "dark"
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
